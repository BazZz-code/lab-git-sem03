<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fotografía de Naturaleza - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8;">

    <nav style="background-color: #2c3e50; padding: 15px; border-radius: 5px;">
        <a href="index.html" style="color: #ecf0f1; text-decoration: none; margin-right: 15px;">Inicio</a>
        <a href="about.html" style="color: #ecf0f1; text-decoration: none; margin-right: 15px;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="margin-top: 30px; background: white; padding: 20px; border-radius: 5px;">
        <h1 style="color: #2c3e50;">Escríbenos</h1>
        <form style="display: flex; flex-direction: column; max-width: 300px;">
            <label style="margin-bottom: 5px; color: #333;">Nombre:</label>
            <input type="text" style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 3px;">
            
            <label style="margin-bottom: 5px; color: #333;">Mensaje:</label>
            <textarea style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 3px;"></textarea>
            
            <button type="submit" style="background-color: #2c3e50; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 3px;">Enviar</button>
        </form>
    </main>
